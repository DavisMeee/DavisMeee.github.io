name: Get Citation Data

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  update-citations:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        id: crawl
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Google Scholar fetch attempt ${attempt}/3"
            if timeout --signal=TERM 150s python google_scholar_crawler/main.py; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Google Scholar temporarily unavailable::The crawler was blocked or timed out. Keeping the last successful citation data; the next scheduled run will retry."

      - name: Publish citation data
        if: steps.crawl.outputs.updated == 'true'
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update citation data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
